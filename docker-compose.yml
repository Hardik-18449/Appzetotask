version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: nexus_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexus_task_management
    volumes:
      - mongo_data:/data/db
    networks:
      - nexus_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/nexus_task_management
      JWT_SECRET: enterprise-secure-jwt-secret-key-2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - nexus_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nexus_network

volumes:
  mongo_data:

networks:
  nexus_network:
    driver: bridge
